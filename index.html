<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git 新手村 v4 —— 闯关学会 Git</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  /* ============ 全局变量 - Cyberpunk/Terminal 美学 ============ */
  :root {
    /* 背景 - 深紫蓝色调 */
    --bg-0: #07061a;
    --bg-1: #0d0b2e;
    --bg-2: #141233;
    --bg-card: rgba(18, 16, 48, 0.55);
    --bg-card-hover: rgba(28, 24, 68, 0.65);

    /* 边框 */
    --border: rgba(192, 132, 252, 0.12);
    --border-strong: rgba(192, 132, 252, 0.22);
    --border-glow: rgba(255, 107, 157, 0.3);

    /* 文字 */
    --text-0: #f8fafc;
    --text-1: #e2e8f0;
    --text-2: #94a3b8;
    --text-3: #64748b;

    /* 主色调 - 霓虹粉 */
    --accent: #ff6b9d;
    --accent-2: #ec4899;
    --accent-soft: rgba(255, 107, 157, 0.15);
    --accent-glow: rgba(255, 107, 157, 0.3);
    --accent-glow-strong: rgba(255, 107, 157, 0.5);

    /* 成功色 - 薄荷绿/青色 */
    --success: #5eead4;
    --success-2: #2dd4bf;
    --success-soft: rgba(94, 234, 212, 0.12);
    --success-glow: rgba(94, 234, 212, 0.3);

    /* 警告色 */
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.12);

    /* 错误色 */
    --error: #fb7185;
    --error-soft: rgba(251, 113, 133, 0.12);

    /* 信息色 */
    --info: #818cf8;
    --info-soft: rgba(129, 140, 248, 0.12);

    /* 辅助色 - 紫色 */
    --purple: #c084fc;
    --purple-2: #a855f7;
    --purple-soft: rgba(192, 132, 252, 0.12);

    /* 青色 */
    --cyan: #67e8f9;
    --cyan-2: #22d3ee;

    /* 圆角 */
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 24px;

    /* 字体 */
    --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
    --font-ui: "PingFang SC", "Microsoft YaHei", "SF Pro Display", system-ui, -apple-system, sans-serif;
  }

  /* ============ 全局重置 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    color: var(--text-0);
    font-family: var(--font-ui);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
    /* 深紫蓝渐变 + 星云径向渐变 */
    background:
      radial-gradient(ellipse 70% 50% at 20% 10%, rgba(192, 132, 252, 0.12), transparent 60%),
      radial-gradient(ellipse 60% 45% at 85% 25%, rgba(255, 107, 157, 0.08), transparent 55%),
      radial-gradient(ellipse 55% 40% at 50% 100%, rgba(99, 102, 241, 0.1), transparent 55%),
      radial-gradient(ellipse 40% 30% at 10% 80%, rgba(94, 234, 212, 0.06), transparent 50%),
      linear-gradient(180deg, #07061a 0%, #0d0b2e 35%, #0a0820 70%, #07061a 100%);
    background-attachment: fixed;
  }

  /* 背景层 1: 网格科技感 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(192, 132, 252, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(192, 132, 252, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  /* 背景层 2: 星空效果 */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 35% 75%, rgba(192, 132, 252, 0.7), transparent),
      radial-gradient(1px 1px at 50% 40%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 65% 15%, rgba(255, 107, 157, 0.6), transparent),
      radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 90% 30%, rgba(94, 234, 212, 0.6), transparent),
      radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 70% 85%, rgba(192, 132, 252, 0.5), transparent),
      radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 5% 45%, rgba(99, 102, 241, 0.5), transparent),
      radial-gradient(1px 1px at 95% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 60% 55%, rgba(255, 107, 157, 0.4), transparent);
    pointer-events: none;
    z-index: 0;
    animation: starTwinkle 4s ease-in-out infinite alternate;
  }

  @keyframes starTwinkle {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  /* 噪点纹理层（最上层，更细腻） */
  .noise-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
    mix-blend-mode: overlay;
  }

  /* ============ 顶部 - 游戏UI风格 ============ */
  header {
    padding: 20px 36px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    z-index: 2;
    background: linear-gradient(180deg, rgba(7, 6, 26, 0.85) 0%, rgba(13, 11, 46, 0.65) 100%);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.03) inset,
      0 4px 20px rgba(0, 0, 0, 0.3);
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(192, 132, 252, 0.3) 20%,
      rgba(255, 107, 157, 0.4) 50%,
      rgba(192, 132, 252, 0.3) 80%,
      transparent 100%);
  }

  header h1 {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #f8fafc 0%, #ff6b9d 50%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: flex;
    align-items: center;
    letter-spacing: 0.02em;
  }

  header h1 .cat-icon {
    display: inline-flex;
    align-items: center;
    margin-right: 8px;
    -webkit-text-fill-color: initial;
    font-size: 26px;
    filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.4));
    animation: catBounce 3s ease-in-out infinite;
  }

  @keyframes catBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  header .subtitle {
    color: var(--text-2);
    font-size: 13px;
    margin-top: 5px;
    font-weight: 400;
    opacity: 0.9;
    letter-spacing: 0.02em;
  }

  .header-right {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  /* 能量条进度 */
  .star-progress {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-track {
    width: 160px;
    height: 8px;
    background: rgba(10, 8, 32, 0.8);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.4),
      0 0 0 1px rgba(192, 132, 252, 0.05);
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #c084fc 0%, #ff6b9d 50%, #5eead4 100%);
    border-radius: 999px;
    transition: width 0.8s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:
      0 0 15px rgba(255, 107, 157, 0.6),
      0 0 8px rgba(192, 132, 252, 0.4);
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 2.5s infinite;
    filter: blur(1px);
  }

  @keyframes shimmer {
    0% { transform: translateX(-150%); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translateX(200%); opacity: 0; }
  }

  .stars {
    font-size: 16px;
    letter-spacing: 2px;
    color: var(--purple);
    text-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
  }

  .progress-text {
    font-size: 12px;
    color: var(--text-2);
    margin-top: 2px;
    letter-spacing: 0.03em;
  }

  /* ============ 主体布局 ============ */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    padding: 28px 36px;
    max-width: 1360px;
    margin: 0 auto;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; padding: 18px; gap: 18px; }
    header { padding: 16px 18px; }
  }

  /* ============ 左栏 ============ */
  .left-col { display: flex; flex-direction: column; gap: 18px; }

  .quest-panel { display: flex; flex-direction: column; gap: 10px; }

  .quest-nav {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: relative;
    overflow: hidden;
  }

  .quest-nav::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.3), transparent);
  }

  .quest-nav .label { font-size: 12px; color: var(--text-3); letter-spacing: 0.03em; }

  .quest-nav .now {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 107, 157, 0.2);
    box-shadow: 0 0 12px rgba(255, 107, 157, 0.15);
  }

  /* ========== 全息任务卡片 - Glassmorphism ========== */
  .quest-card {
    background: rgba(18, 16, 48, 0.45);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    transition: all .4s cubic-bezier(.2,.9,.3,1);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .quest-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(192, 132, 252, 0.25) 30%,
      rgba(255, 107, 157, 0.3) 50%,
      rgba(192, 132, 252, 0.25) 70%,
      transparent 100%);
    opacity: 0.6;
    transition: opacity .3s;
  }

  .quest-card:hover {
    transform: translateY(-3px);
    border-color: rgba(192, 132, 252, 0.25);
    background: rgba(28, 24, 68, 0.55);
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.35),
      0 0 30px rgba(192, 132, 252, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .quest-card:hover::before {
    opacity: 1;
  }

  /* Active 卡 - 增强发光 + 扫描线 */
  .quest-card.active {
    border-color: rgba(255, 107, 157, 0.45);
    background: linear-gradient(135deg,
      rgba(35, 20, 58, 0.7) 0%,
      rgba(45, 25, 75, 0.6) 50%,
      rgba(25, 20, 55, 0.7) 100%);
    box-shadow:
      0 0 0 1px rgba(255, 107, 157, 0.15),
      0 8px 40px rgba(255, 107, 157, 0.18),
      0 0 60px rgba(255, 107, 157, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: activeCardBreath 3s ease-in-out infinite;
  }

  @keyframes activeCardBreath {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(255, 107, 157, 0.15),
        0 8px 40px rgba(255, 107, 157, 0.18),
        0 0 60px rgba(255, 107, 157, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255, 107, 157, 0.25),
        0 8px 50px rgba(255, 107, 157, 0.28),
        0 0 80px rgba(255, 107, 157, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
  }

  .quest-card.active::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 107, 157, 0.06) 50%,
      transparent 100%);
    animation: scanLine 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes scanLine {
    0% { left: -100%; }
    50%, 100% { left: 100%; }
  }

  .quest-card.done {
    border-color: rgba(94, 234, 212, 0.25);
    opacity: .85;
    background: linear-gradient(135deg,
      rgba(18, 40, 48, 0.5) 0%,
      rgba(15, 35, 42, 0.5) 100%);
  }

  .quest-card.locked { opacity: .5; filter: grayscale(0.4); }

  .quest-card h3 {
    font-size: 16px;
    margin-bottom: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text-0);
  }

  .quest-card.active h3 {
    background: linear-gradient(135deg, #fff 0%, #ff6b9d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .quest-card .story {
    color: var(--text-2);
    font-size: 13.5px;
    line-height: 1.75;
    margin-bottom: 14px;
  }

  .quest-card .goal {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-0);
    background: rgba(7, 6, 26, 0.6);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-weight: 500;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .quest-card.done .goal {
    border-left-color: var(--success);
  }

  .quest-card .status {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.02em;
  }

  .quest-card.done .status { color: var(--success); text-shadow: 0 0 10px rgba(94, 234, 212, 0.3); }
  .quest-card.locked .status { color: var(--text-3); }
  .quest-card.active .status { color: var(--accent); text-shadow: 0 0 10px rgba(255, 107, 157, 0.3); }

  /* ============ 技能书 ============ */
  .skillbook {
    background: rgba(18, 16, 48, 0.45);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .skillbook::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(180deg, var(--accent), var(--purple), var(--cyan));
    opacity: 0.6;
    box-shadow: 0 0 12px rgba(255, 107, 157, 0.3);
  }

  .skillbook h4 {
    font-size: 13px;
    color: var(--text-1);
    margin-bottom: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 8px;
    letter-spacing: 0.03em;
  }

  .skillbook h4::before {
    content: '';
    display: inline-block;
    width: 22px;
    height: 18px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    border-radius: 2px 6px 6px 2px;
    position: relative;
    box-shadow: 0 0 10px rgba(255, 107, 157, 0.25);
  }

  .skillbook h4::after {
    content: '';
    position: absolute;
    margin-left: 2px;
    width: 5px;
    height: 18px;
    background: rgba(255,255,255,0.25);
    border-radius: 0 2px 2px 0;
  }

  .skill-item {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-2);
    padding: 9px 14px;
    margin-bottom: 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all .3s cubic-bezier(.2,.9,.3,1);
    position: relative;
    padding-left: 28px;
    overflow: hidden;
    z-index: 1;
  }

  .skill-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: linear-gradient(90deg, var(--accent-soft), transparent);
    transition: width .3s ease;
    z-index: -1;
    border-radius: var(--radius-sm);
  }

  .skill-item::after {
    content: '📘';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: 0.7;
    transition: all .25s;
  }

  .skill-item:last-child { margin-bottom: 0; }

  .skill-item:hover {
    color: var(--text-0);
    transform: translateX(3px);
  }

  .skill-item:hover::before {
    width: 100%;
  }

  .skill-item:hover::after {
    opacity: 1;
    transform: translateY(-50%) scale(1.15);
    filter: drop-shadow(0 0 4px var(--accent-glow));
  }

  .skill-item .tag {
    display: inline-block;
    font-family: var(--font-mono);
    background: var(--success-soft);
    color: var(--success);
    border-radius: 5px;
    padding: 2px 8px;
    margin-right: 8px;
    font-size: 11.5px;
    font-weight: 500;
    border: 1px solid rgba(94, 234, 212, 0.2);
    box-shadow: 0 0 8px rgba(94, 234, 212, 0.1);
  }

  .skill-empty {
    font-size: 12px;
    color: var(--text-3);
    padding-left: 12px;
    font-style: italic;
    opacity: 0.8;
  }

  /* ============ 终端 - 赛博朋克风格 ============ */
  .terminal-wrap {
    background: #050416;
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 480px;
    position: relative;
    box-shadow:
      0 25px 80px rgba(0, 0, 0, 0.5),
      0 4px 16px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  /* 渐变发光边框 */
  .terminal-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: linear-gradient(135deg,
      rgba(192, 132, 252, 0.3) 0%,
      rgba(255, 107, 157, 0.25) 25%,
      rgba(94, 234, 212, 0.2) 50%,
      rgba(192, 132, 252, 0.25) 75%,
      rgba(255, 107, 157, 0.3) 100%);
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
  }

  /* 终端顶部栏 */
  .term-bar {
    background: linear-gradient(180deg, #1a1535 0%, #120e2a 100%);
    padding: 12px 18px;
    font-size: 12px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .term-bar::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 107, 157, 0.3) 30%,
      rgba(192, 132, 252, 0.3) 70%,
      transparent 100%);
  }

  .dots { display: flex; gap: 8px; }

  .dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    position: relative;
    box-shadow:
      inset 0 1px 2px rgba(0,0,0,0.3),
      0 0 0 1px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: all .2s ease;
  }

  .dot:hover {
    transform: scale(1.2);
    filter: brightness(1.3);
  }

  .dot.r { background: linear-gradient(135deg, #fb7185, #f43f5e); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 8px rgba(251, 113, 133, 0.3); }
  .dot.y { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 8px rgba(251, 191, 36, 0.3); }
  .dot.g { background: linear-gradient(135deg, #5eead4, #2dd4bf); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 8px rgba(94, 234, 212, 0.3); }

  .term-title {
    flex: 1;
    text-align: center;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-2);
    letter-spacing: 0.03em;
    font-family: var(--font-mono);
    opacity: 0.8;
  }

  /* 终端屏幕 - 增强CRT效果 */
  .term-screen {
    flex: 1;
    padding: 18px 22px;
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.85;
    overflow-y: auto;
    height: 460px;
    position: relative;
    background:
      radial-gradient(ellipse at center, rgba(7, 6, 22, 0.97) 0%, rgba(5, 4, 18, 0.99) 100%);
  }

  /* CRT 扫描线 */
  .term-screen::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.15) 3px,
        rgba(0, 0, 0, 0.15) 4px
      );
    pointer-events: none;
    z-index: 1;
    opacity: 0.6;
  }

  /* CRT 暗角/曲率效果 */
  .term-screen::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.4) 100%),
      linear-gradient(180deg, rgba(192, 132, 252, 0.03) 0%, transparent 20%, transparent 80%, rgba(255, 107, 157, 0.02) 100%);
    pointer-events: none;
    z-index: 1;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }

  .line {
    white-space: pre-wrap;
    word-break: break-all;
    position: relative;
    z-index: 2;
  }

  /* 终端提示符美化 */
  .line .prompt-user {
    color: var(--success);
    font-weight: 600;
    text-shadow: 0 0 8px rgba(94, 234, 212, 0.3);
  }

  .line .prompt-user::before {
    content: '\276F ';
    color: var(--accent);
    font-weight: 700;
    margin-right: 2px;
  }

  .line .prompt-path {
    color: var(--purple);
    font-weight: 500;
    text-shadow: 0 0 8px rgba(192, 132, 252, 0.25);
  }

  .line .err { color: var(--error); text-shadow: 0 0 8px rgba(251, 113, 133, 0.2); }
  .line .ok { color: var(--success); text-shadow: 0 0 8px rgba(94, 234, 212, 0.2); }
  .line .info { color: var(--text-2); }
  .line .new { color: var(--error); font-weight: 600; }
  .line .staged { color: var(--success); font-weight: 600; }
  .line .branch { color: var(--accent); font-weight: 600; text-shadow: 0 0 8px rgba(255, 107, 157, 0.3); }
  .line .warn { color: var(--warn); font-weight: 500; }
  .line.dim { opacity: .65; }

  /* 滚动条美化 */
  .term-screen::-webkit-scrollbar { width: 8px; }
  .term-screen::-webkit-scrollbar-track { background: transparent; }
  .term-screen::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(192, 132, 252, 0.2), rgba(255, 107, 157, 0.2));
    border-radius: 4px;
  }
  .term-screen::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(192, 132, 252, 0.35), rgba(255, 107, 157, 0.35));
  }

  /* ============ 输入行 ============ */
  .term-input-line {
    display: flex;
    align-items: center;
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 13.5px;
    background: linear-gradient(180deg, rgba(10, 8, 32, 0.5) 0%, rgba(7, 6, 22, 0.7) 100%);
    position: relative;
  }

  .term-input-line::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(192, 132, 252, 0.2) 30%,
      rgba(255, 107, 157, 0.2) 70%,
      transparent 100%);
  }

  .term-input-line .prompt {
    color: var(--success);
    margin-right: 12px;
    white-space: nowrap;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(94, 234, 212, 0.25);
  }

  .term-input-line .prompt::before {
    content: '\276F ';
    color: var(--accent);
    font-weight: 700;
  }

  .term-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-0);
    font: inherit;
    caret-color: var(--accent);
    caret-shape: block;
  }

  /* 自定义光标呼吸效果 - 增强版 */
  .term-input:focus {
    caret-color: transparent;
  }

  .cursor-blink {
    display: inline-block;
    width: 9px;
    height: 1.25em;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: cursorBreath 1.1s ease-in-out infinite;
    border-radius: 2px;
    box-shadow:
      0 0 10px rgba(255, 107, 157, 0.7),
      0 0 20px rgba(255, 107, 157, 0.4),
      0 0 30px rgba(255, 107, 157, 0.2);
  }

  @keyframes cursorBreath {
    0%, 100% {
      opacity: 1;
      box-shadow:
        0 0 10px rgba(255, 107, 157, 0.7),
        0 0 20px rgba(255, 107, 157, 0.4),
        0 0 30px rgba(255, 107, 157, 0.2);
      transform: scaleY(1);
    }
    50% {
      opacity: 0.25;
      box-shadow:
        0 0 4px rgba(255, 107, 157, 0.3),
        0 0 8px rgba(255, 107, 157, 0.15);
      transform: scaleY(0.9);
    }
  }

  .btn-row { display: flex; gap: 10px; margin: 0 18px 18px; flex-wrap: wrap; }

  .hint-btn {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(192, 132, 252, 0.05));
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 18px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.9,.3,1);
    font-family: inherit;
    font-weight: 500;
    position: relative;
    overflow: hidden;
  }

  .hint-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left .4s;
  }

  .hint-btn:hover {
    color: var(--text-0);
    border-color: var(--border-strong);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(192, 132, 252, 0.08));
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), 0 0 20px rgba(192, 132, 252, 0.1);
  }

  .hint-btn:hover::before {
    left: 100%;
  }

  .hint-btn:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  /* ============ 知识点弹窗 - 分层设计 ============ */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(3, 2, 12, 0.88);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
    animation: fadeIn .25s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(40px) scale(.94);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .line { animation: popIn .25s ease; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal {
    background: linear-gradient(145deg, #1a1638 0%, #161230 50%, #1e1840 100%);
    border-radius: var(--radius-xl);
    max-width: 640px; width: 100%;
    max-height: 86vh; overflow-y: auto;
    padding: 36px 38px;
    animation: slideUp .5s cubic-bezier(.2,.9,.3,1.1);
    box-shadow:
      0 40px 100px rgba(0,0,0,.6),
      0 0 60px rgba(192, 132, 252, 0.1),
      0 0 0 1px rgba(192, 132, 252, 0.12) inset,
      0 1px 0 rgba(255, 255, 255, 0.06) inset;
    position: relative;
    border: 1px solid var(--border-strong);
  }

  /* 发光顶边 */
  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1.5px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255, 107, 157, 0.6) 30%,
      rgba(192, 132, 252, 0.6) 50%,
      rgba(94, 234, 212, 0.6) 70%,
      transparent 100%);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    filter: blur(0.5px);
    box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
  }

  /* 关闭按钮 - 优雅浮动 */
  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all .25s cubic-bezier(.2,.9,.3,1);
    z-index: 10;
    backdrop-filter: blur(10px);
  }

  .modal-close:hover {
    background: rgba(255, 107, 157, 0.15);
    border-color: rgba(255, 107, 157, 0.3);
    color: var(--accent);
    transform: rotate(90deg) scale(1.1);
    box-shadow: 0 0 16px rgba(255, 107, 157, 0.3);
  }

  /* 弹窗滚动条 */
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(192, 132, 252, 0.25), rgba(255, 107, 157, 0.25));
    border-radius: 3px;
  }

  .modal .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent-soft), var(--purple-soft));
    color: var(--accent);
    border: 1px solid rgba(255, 107, 157, 0.3);
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: 0.05em;
    box-shadow:
      0 0 20px rgba(255, 107, 157, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    text-transform: uppercase;
  }

  .modal h2 {
    font-size: 26px;
    margin-bottom: 8px;
    font-weight: 800;
    background: linear-gradient(135deg, #f8fafc 0%, #c084fc 50%, #ff6b9d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.01em;
  }

  .modal .sub {
    color: var(--text-3);
    font-size: 14px;
    margin-bottom: 24px;
    font-style: italic;
    opacity: 0.9;
  }

  .know-block {
    margin-bottom: 20px;
    padding: 16px 18px;
    background: rgba(7, 6, 26, 0.5);
    border-radius: var(--radius-md);
    border: 1px solid rgba(192, 132, 252, 0.08);
    transition: all .25s;
    backdrop-filter: blur(4px);
  }

  .know-block:hover {
    border-color: rgba(192, 132, 252, 0.18);
    background: rgba(12, 10, 38, 0.6);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
  }

  .know-block .k-head {
    font-size: 13px;
    font-weight: 700;
    color: var(--purple);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.03em;
    text-shadow: 0 0 10px rgba(192, 132, 252, 0.2);
  }

  .know-block .k-head .ico { font-size: 16px; }

  .know-block p {
    font-size: 14px;
    line-height: 1.9;
    color: var(--text-1);
  }

  .know-block code {
    font-family: var(--font-mono);
    background: linear-gradient(135deg, var(--success-soft), rgba(94, 234, 212, 0.08));
    border: 1px solid rgba(94, 234, 212, 0.2);
    border-radius: 5px;
    padding: 2px 8px;
    color: var(--success);
    font-size: 12.5px;
    font-weight: 500;
    box-shadow: 0 0 8px rgba(94, 234, 212, 0.1);
  }

  .know-block .analogy {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), rgba(251, 191, 36, 0.04));
    border-left: 3px solid var(--warn);
    padding: 12px 16px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 14px;
    line-height: 1.85;
    color: var(--text-1);
  }

  .know-block .real {
    background: linear-gradient(135deg, var(--info-soft), rgba(129, 140, 248, 0.06));
    border: 1px solid rgba(129, 140, 248, 0.2);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.85;
    color: var(--text-1);
  }

  .know-block ul { margin-left: 20px; }

  .know-block li {
    font-size: 14px;
    line-height: 1.95;
    color: var(--text-1);
  }

  .know-block .tip-author {
    font-style: italic;
    color: var(--text-3);
    font-size: 12.5px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(192, 132, 252, 0.1);
  }

  .modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 30px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }

  .modal-footer .note {
    font-size: 12px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }

  /* 主按钮 - 渐变 + 光扫效果 */
  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d 0%, #c084fc 50%, #ff6b9d 100%);
    background-size: 200% 100%;
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 30px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .3s cubic-bezier(.2,.9,.3,1);
    font-family: inherit;
    box-shadow:
      0 4px 20px rgba(255, 107, 157, 0.35),
      0 0 40px rgba(255, 107, 157, 0.1);
    letter-spacing: 0.03em;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left .6s ease;
    transform: skewX(-15deg);
  }

  .btn-primary:hover {
    background-position: 100% 0;
    transform: translateY(-2px);
    box-shadow:
      0 8px 30px rgba(255, 107, 157, 0.45),
      0 0 60px rgba(255, 107, 157, 0.15);
    filter: brightness(1.08);
  }

  .btn-primary:hover::before {
    left: 120%;
  }

  .btn-primary:active {
    transform: translateY(1px);
    box-shadow:
      0 2px 10px rgba(255, 107, 157, 0.3),
      0 0 20px rgba(255, 107, 157, 0.1);
  }

  .btn-ghost {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(192, 132, 252, 0.03));
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 22px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all .25s;
    position: relative;
    overflow: hidden;
  }

  .btn-ghost:hover {
    color: var(--text-0);
    border-color: var(--border-strong);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(192, 132, 252, 0.06));
    transform: translateY(-1px);
  }

  /* 通关横幅 */
  .banner {
    background: linear-gradient(135deg,
      rgba(94, 234, 212, 0.12) 0%,
      rgba(129, 140, 248, 0.1) 50%,
      rgba(192, 132, 252, 0.08) 100%);
    border: 1px solid rgba(94, 234, 212, 0.3);
    border-radius: var(--radius-md);
    padding: 14px 20px;
    font-size: 14px;
    color: var(--success);
    margin-bottom: 16px;
    animation: bannerPop .5s cubic-bezier(.2,.9,.3,1.3);
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 20px rgba(94, 234, 212, 0.1),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    font-weight: 500;
  }

  @keyframes bannerPop {
    from { opacity: 0; transform: scale(.85) translateY(-12px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .banner::before {
    content: '\2728';
    margin-right: 10px;
    filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.5));
  }

  /* 通关庆祝粒子 */
  .celebrate-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 200;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: confettiFall linear forwards;
    border-radius: 2px;
    box-shadow: 0 0 6px currentColor;
  }

  @keyframes confettiFall {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(720deg) scale(0.5);
      opacity: 0;
    }
  }

  .star-burst {
    position: absolute;
    font-size: 22px;
    animation: starBurst 1.8s cubic-bezier(.2,.9,.3,1) forwards;
    filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
  }

  @keyframes starBurst {
    0% {
      transform: scale(0) translate(0, 0);
      opacity: 0;
    }
    15% {
      transform: scale(1.4) translate(0, 0);
      opacity: 1;
    }
    100% {
      transform: scale(0.4) translate(var(--tx, 50px), var(--ty, -100px));
      opacity: 0;
    }
  }

  /* 彩带效果 */
  .ribbon {
    position: absolute;
    width: 12px;
    height: 40px;
    top: -20px;
    animation: ribbonFall linear forwards;
    border-radius: 2px;
    opacity: 0.8;
  }

  @keyframes ribbonFall {
    0% {
      transform: translateY(0) rotate(0deg) scaleY(1);
      opacity: 0.9;
    }
    50% {
      transform: translateY(50vh) rotate(180deg) scaleY(0.9);
    }
    100% {
      transform: translateY(100vh) rotate(360deg) scaleY(0.7);
      opacity: 0;
    }
  }

  /* 闪光粒子 */
  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    animation: sparkleFloat 2s ease-out forwards;
    box-shadow:
      0 0 10px #fff,
      0 0 20px currentColor;
  }

  @keyframes sparkleFloat {
    0% {
      transform: translate(0, 0) scale(0);
      opacity: 0;
    }
    20% {
      transform: translate(0, -20px) scale(1.2);
      opacity: 1;
    }
    100% {
      transform: translate(var(--sx, 30px), var(--sy, -80px)) scale(0);
      opacity: 0;
    }
  }

  /* 烟花效果 */
  .firework {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    animation: fireworkBurst 1.1s cubic-bezier(.2,.6,.3,1) forwards;
    box-shadow:
      0 0 6px currentColor,
      0 0 12px currentColor;
  }
  @keyframes fireworkBurst {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(0);
      opacity: 0;
    }
  }

  /* 通关卡片发光 */
  .quest-card.done.celebrate {
    animation: donePulse 0.8s cubic-bezier(.2,.9,.3,1);
  }

  @keyframes donePulse {
    0% {
      box-shadow:
        0 0 0 0 rgba(94, 234, 212, 0.6),
        0 4px 24px rgba(0, 0, 0, 0.25);
    }
    40% {
      box-shadow:
        0 0 40px 15px rgba(94, 234, 212, 0.25),
        0 0 80px 20px rgba(94, 234, 212, 0.1),
        0 8px 40px rgba(0, 0, 0, 0.3);
    }
    100% {
      box-shadow:
        0 0 0 0 rgba(94, 234, 212, 0),
        0 4px 24px rgba(0, 0, 0, 0.25);
    }
  }

  /* ============ 跳关 ============ */
  .jump-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .25s;
    font-family: inherit;
    margin-left: 8px;
    letter-spacing: 0.02em;
  }

  }

  }

  }

  .level-item .lv-num {
    display: block;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 3px;
  }

  .level-item .lv-title {
    font-size: 11px;
    color: var(--text-2);
    line-height: 1.4;
  }

  .level-item.current .lv-title { color: var(--success); }

  /* ============ 重置进度按钮 ============ */
  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 10px 14px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-3);
    font-size: 11.5px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all .25s;
    font-family: inherit;
    text-align: center;
    letter-spacing: 0.03em;
  }

  .reset-btn:hover {
    color: var(--error);
    border-color: var(--error);
    background: var(--error-soft);
    box-shadow: 0 0 12px rgba(251, 113, 133, 0.1);
  }

  /* ============ 终端危险警告样式 ============ */
  .line .danger {
    color: var(--error);
    font-weight: 600;
    background: var(--error-soft);
    padding: 3px 8px;
    border-radius: 5px;
    display: inline-block;
    border: 1px solid rgba(251, 113, 133, 0.25);
    text-shadow: 0 0 8px rgba(251, 113, 133, 0.2);
  }

  /* ============ 新动画类 ============ */

  /* 渐次淡入 */
  .stagger-item {
    opacity: 0;
    transform: translateY(20px);
    animation: staggerIn .7s cubic-bezier(.2,.9,.3,1) forwards;
  }

  .stagger-header { animation-delay: 0.1s; }
  .stagger-left { animation-delay: 0.25s; }
  .stagger-terminal { animation-delay: 0.4s; }

  @keyframes staggerIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 页面加载动画 - 通过 stagger-item 类控制 */

  /* 关卡切换动画 */
  .level-transition-out {
    animation: levelFadeOut .3s ease forwards;
  }

  .level-transition-in {
    animation: levelFadeIn .4s cubic-bezier(.2,.9,.3,1) forwards;
  }

  @keyframes levelFadeOut {
    to { opacity: 0; transform: translateY(-8px) scale(.98); }
  }

  @keyframes levelFadeIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 打字机效果 */
  .typewriter {
    overflow: hidden;
    border-right: 2px solid var(--accent);
    white-space: nowrap;
    animation:
      typing 2s steps(40, end),
      blink-caret 0.75s step-end infinite;
  }

  @keyframes typing {
    from { width: 0; }
    to { width: 100%; }
  }

  @keyframes blink-caret {
    from, to { border-color: transparent; }
    50% { border-color: var(--accent); }
  }

  /* 脉冲发光 */
  .pulse-glow {
    animation: pulseGlow 2s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 12px rgba(255, 107, 157, 0.3); }
    50% { box-shadow: 0 0 24px rgba(255, 107, 157, 0.6), 0 0 40px rgba(192, 132, 252, 0.2); }
  }

  /* 响应式 */
  @media (max-width: 600px) {
    header h1 { font-size: 18px; }
    header h1 .cat-icon { font-size: 22px; }
    header .subtitle { font-size: 11px; }
    .progress-bar-track { width: 110px; height: 7px; }
    .stars { font-size: 13px; }
    .term-screen { padding: 14px 16px; font-size: 12.5px; height: 400px; }

    .level-selector-grid { grid-template-columns: repeat(2, 1fr); }
    .btn-row { margin: 0 14px 14px; }
    .btn-primary { padding: 10px 24px; font-size: 13px; }
  }
</style>
</head>

<script>
/* ==========================================================
 * Git 新手村 —— 互动式 Git 教学 v2
 * ----------------------------------------------------------
 * 全部状态存在 state 对象里，逻辑都是纯 JS，零依赖。
 * ========================================================== */

// ---------- 游戏状态 ----------
const state = {
  repo: false,
  branch: 'main',
  branches: ['main'],
  files: {
    'README.md': {
      content: '# 我的第一行代码\n\n你好，Git 世界！\n\n这是我的第一个 Git 仓库。',
      stage: 'untracked',
      branch: 'main',
      committedOn: [],
    },
  },
  commits: [],
  remote: null,
  pushed: false,
  level: 0,
  MAX_LEVEL: 12,
  unlockedSkills: [],
  merging: null,
  mergeAttempted: false,
  merged: false,
  conflictSeen: false,
  conflictResolved: false,
  statusUsed: false,
  logUsed: false,
  restoreUsed: false,
  published: false,
  lectureDone: false,
};

// ---------- 碎碎念计数器 ----------
let errorCount = 0;

// ---------- 关卡定义 ----------
const LEVELS = {
  1: {
    title: '关卡 1 · 建立营地',
    story: '你降生在一片名叫「项目」的荒野，身上只有一份 README.md。没有 Git 的保护，任何改动都会说没就没。',
    goal: '初始化一个 Git 仓库，把这片荒野变成受版本控制的营地。',
    hint: '输入命令: git init',
    check: () => state.repo,
    skill: 'init',
    knowledge: {
      title: '什么是 Git 仓库？',
      sub: '你刚刚做的这件事，是整个 Git 世界的地基',
      blocks: [
        { icon: '🤔', head: '先聊聊 Git 到底是个啥', type: 'text',
          text: 'Git 是一个「分布式版本控制系统」。听起来唬人，拆开看就俩词：<b>版本控制</b> = 帮你记住文件的每一次改动，随时能翻回去；<b>分布式</b> = 每个电脑上都有完整的一份历史，不依赖某个中央服务器。' },
        { icon: '🎮', head: '用游戏理解就简单了', type: 'analogy',
          text: '玩游戏最怕啥？打了三小时没存档，一死回到解放前。<br>Git 就是给你的代码<b>每走一步都能存档</b>的机制。而 <code>git init</code> 就是「开启存档功能」的那一下 —— 它在你项目文件夹里悄悄建了个 <code>.git</code> 的隐藏文件夹，之后所有存档都塞这里面。<br><br>就这一下？对，就这一下。' },
        { icon: '💼', head: '现实中怎么用', type: 'real',
          text: '你拿到一个新项目，或者自己从零开始写东西，<b>第一件事基本都是 <code>git init</code></b>。没有它，后面所有 Git 命令都会给你甩一句 <code>fatal: not a git repository</code> —— 就是你刚才如果先输 <code>git status</code> 看到的那堆红字。' },
        { icon: '📝', head: '几个注意点', type: 'list',
          items: [
            '一个项目 = 一个 Git 仓库，<code>git init</code> 一般就做一次',
            '它不会上传到网上，只是本地多了个 <code>.git</code> 文件夹而已',
            '<code>.git</code> 文件夹千万别手动删，删了历史就全没了（别问我怎么知道的）',
          ] },
      ],
    },
  },

  2: {
    title: '关卡 2 · 查看状态',
    story: '营地建好了，但你完全不知道现在啥情况：哪些文件被 Git 管着？哪些还是野生状态？',
    goal: '使用查看状态的命令，看看 README.md 现在是什么情况。',
    hint: '输入命令: git status',
    check: () => state.statusUsed,
    skill: 'status',
    knowledge: {
      title: 'git status —— 迷路时的指南针',
      sub: '这可能是你敲得最多的一个 Git 命令',
      blocks: [
        { head: '先说结论', type: 'text',
          text: '<code>git status</code> 不会修改任何东西，它只是<b>告诉你现在处于什么状态</b>：当前在哪个分支、哪些文件改了、哪些已经准备好了要提交。' },
        { icon: '🗺️', head: '打个不太恰当的比方', type: 'analogy',
          text: '游戏里的「小地图 / 任务追踪面板」。你随时按一下就知道：我在哪、任务做到哪一步、还有啥没做。<br>迷路的时候不知道该干嘛？<b>先打 <code>git status</code></b>，它基本上会告诉你下一步该做什么。' },
        { icon: '💼', head: '真实项目里长这样', type: 'real',
          text: '真实项目里它可能同时显示几十个文件。你会看到大量 <span style="color:#f87171">红色（未暂存 / 未跟踪）</span>和 <span style="color:#4ade80">绿色（已暂存）</span>。<br>老程序员有个习惯：<b>提交前必跑一次 <code>git status</code></b>，确认没有把密码、日志、临时文件之类的垃圾一起提交上去。' },
        { icon: '🔄', head: '文件的几种状态', type: 'list',
          items: [
            '<b>未跟踪 untracked</b>：新文件，Git 还没管它',
            '<b>已修改 modified</b>：改过了，但还没准备提交',
            '<b>已暂存 staged</b>：已经放进「待提交区」，下一步就能存档',
            '<b>已提交 committed</b>：存档完成，安全了',
          ] },
      ],
    },
  },

  3: {
    title: '关卡 3 · 篝火与存档',
    story: 'README.md 还是「黑户」——Git 根本没在管理它。游戏要有存档点才安心。',
    goal: '把 README.md 加入暂存区，然后完成你人生第一次提交（commit）。',
    hint: '先输入 git add README.md ，再输入 git commit -m "任意提交信息"',
    check: () => state.commits.length >= 1,
    skill: 'add',
    knowledge: {
      title: '暂存区 + 提交 = Git 的灵魂',
      sub: '这一关很重要，务必搞懂',
      blocks: [
        { icon: '💡', head: '核心是「两步走」', type: 'text',
          text: 'Git 把「保存」拆成了<b>两步</b>，这一点和 Word 的 Ctrl+S 完全不一样：<br>① <code>git add</code> —— 挑选这次要存哪些改动（放进暂存区）<br>② <code>git commit</code> —— 真正拍下一张「快照」，永久记入历史' },
        { icon: '🛒', head: '用购物车理解一下', type: 'analogy',
          text: '想象你在超市购物：<br><code>git add</code> = <b>把商品放进购物车</b>（还可以反悔，拿出来）<br><code>git commit</code> = <b>去收银台结账</b>（这一步就写进历史了）<br><br>为啥要分两步？因为你可能今天改了 5 个文件，但只想提交其中 2 个，另外 3 个还没写完。<b>暂存区给了你「精准挑选」的自由</b>。' },
        { icon: '✍️', head: '提交信息怎么写才不被打', type: 'real',
          text: '现实中 commit 信息是给<b>三个月后的自己和同事</b>看的。所以别写「修改」「更新」「fix」这种废话，别人看了想打人。' },
        { head: '好的 vs 烂的提交信息', type: 'list',
          items: [
            '👍 <code>feat: 新增用户登录接口</code>',
            '👍 <code>fix: 修复端口扫描在断网时挂死的问题</code>',
            '👎 <code>update</code>　👎 <code>改了一下</code>　👎 <code>111</code>',
          ] },
        { icon: '⌨️', head: '几个常用写法', type: 'code',
          text: 'git add .                    # 把当前所有改动都加进去（偷懒神器）\ngit add README.md            # 只加指定文件\ngit commit -m "提交信息"      # -m 后面直接跟信息' },
        { head: '说句掏心窝子的', type: 'text',
          text: '说实话我到现在也经常直接 <code>git add .</code> 一把梭，不丢人。小项目、自己玩的项目，怎么方便怎么来。但如果是团队协作的正式项目，还是建议 <code>git add -p</code> 或者逐个文件加，看清楚每一行改动再提交 —— 相信我，这个习惯迟早能救你一次。' },
      ],
    },
  },

  4: {
    title: '关卡 4 · 翻阅史书',
    story: '恭喜，你已经有了第一个存档点。但存档到底长什么样？能不能翻回去看看？',
    goal: '查看你的提交历史，看清楚每一次存档都记了什么。',
    hint: '输入命令: git log',
    check: () => state.logUsed,
    skill: 'log',
    knowledge: {
      title: 'git log —— 项目的时光机',
      sub: '每一次 commit 都被记录在这里，永不丢失',
      blocks: [
        { icon: '📜', head: '它是干嘛的', type: 'text',
          text: '<code>git log</code> 按时间<b>倒序</b>列出所有提交（最新的在最上面）。每一条包含：独一无二的 <b>commit 哈希值</b>（那串看起来像乱码的十六进制数）、作者、时间、提交信息。' },
        { head: '打个比方', type: 'analogy',
          text: '游戏里的「存档列表」界面 —— 每个存档都有编号、时间、你当时的备注。<br>那串哈希值（比如 <code>a1b2c3d</code>）就是<b>存档编号</b>，全世界唯一。理论上你可以用这个编号把代码「读档」到那一次的状态。' },
        { icon: '💼', head: '实际工作中的用法', type: 'real',
          text: '① <b>排查 bug</b>：想知道某个功能是哪次改坏的？翻 log 一条条看。<br>② <b>写周报</b>：真的有人直接 <code>git log</code> 看这周自己干了啥，复制粘贴当周报。（别说是我教的）<br>③ <b>代码审查</b>：PR 里能看到这个分支的所有提交，一眼看懂来龙去脉。' },
        { icon: '⚡', head: '几个进阶技巧', type: 'list',
          items: [
            '<code>git log --oneline</code> 一行一条，清爽版（真项目里最常用）',
            '<code>git log --graph</code> 画出分支合并的树形图，挺酷炫的',
            '按 <code>q</code> 退出 log 界面（真终端里常用，第一次容易懵）',
          ] },
      ],
    },
  },

  5: {
    title: '关卡 5 · 平行世界',
    story: '一条直线走到底太危险了。想在主线上安心，又想试试新功能？你需要 Git 最强大的魔法 —— 分支。',
    goal: '创建一个名为 feature 的新分支。',
    hint: '输入命令: git branch feature',
    check: () => state.branches.includes('feature'),
    skill: 'branch',
    knowledge: {
      title: '分支 branch —— Git 最强大的魔法',
      sub: '没有分支，Git 就只是个「带历史记录的网盘」',
      blocks: [
        { icon: '🌿', head: '先说概念', type: 'text',
          text: '分支就是<b>一条独立的开发线</b>。你可以从主线上「岔」一条出来，在上面随便折腾，<b>完全不影响主线</b>。搞好了就合并回去，搞砸了直接删掉，主线毫发无伤。' },
        { head: '用游戏打个比方', type: 'analogy',
          text: '玩《塞尔达》的时候，存档前想试试「如果我把这个 NPC 砍了会怎样」—— 但你又不想破坏主线进度。<br>于是你<b>复制一份存档</b>，在副本里随便浪，满意了就把成果带回主线，不满意就删掉副本。<br>这个「副本存档」就是<b>分支</b>。<br><br>主线通常叫 <code>main</code>（老项目里叫 <code>master</code>），是稳定可用的版本。' },
        { icon: '🏢', head: '真实团队的工作流', type: 'real',
          text: '正经团队基本都是这个流程：<br>① 从 <code>main</code> 拉一个分支，比如 <code>feature/login</code><br>② 在分支上开发、提交<br>③ 开发完提 PR（Pull Request）请同事审查<br>④ 审查通过，合并回 <code>main</code>，分支删除<br><br><b>你从 GitHub 下载别人的项目，自己改东西时也建议先开分支</b>，不然你的改动会跟原版混在一起，很难受。' },
        { icon: '⚠️', head: '新人容易踩的坑', type: 'list',
          items: [
            '<code>git branch feature</code> 只是<b>创建</b>分支，你人还停在原分支上！',
            '要「切过去工作」还得 <code>git checkout feature</code>（下一关讲）',
            '创建分支几乎瞬间完成 —— 因为它只是加了个「指针」，没有复制文件',
          ] },
      ],
    },
  },

  6: {
    title: '关卡 6 · 穿越世界线',
    story: '分支建好了，但你的身体还在主线世界。得「穿越」过去，才能真正在分支上干活。',
    goal: '切换到 feature 分支上。',
    hint: '输入命令: git checkout feature',
    check: () => state.branch === 'feature',
    skill: 'checkout',
    knowledge: {
      title: 'git checkout —— 切换你的「世界线」',
      sub: '注意看：你的提示符会跟着变',

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function echoCommand(cmd) {
  print(`<span class="prompt-user">冒险者@新手村</span>:<span class="prompt-path">~/项目</span>$ ${esc(cmd)}`);
}

function tokenize(cmd) {
  const tokens = [];
  let cur = '', inQuote = false;
  for (const ch of cmd.trim()) {
    if (ch === '"') { inQuote = !inQuote; continue; }
    if (ch === ' ' && !inQuote) { if (cur) tokens.push(cur); cur = ''; continue; }
    cur += ch;
  }
  if (cur) tokens.push(cur);
  return tokens;
}

function cmdGitInit() {

function cmdGitStatus() {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  const firstTime = !state.statusUsed;
  state.statusUsed = true;

  // 冲突场景
  if (state.merging) {
    print(`位于分支 <span class="branch">${state.branch}</span>`);
    print('您有尚未合并的路径。', 'err');
    print('  （解决冲突并运行 "git commit"）', 'info dim');
    print('');
    print('未合并的路径：', 'info');
    print('  （使用 "git add <文件>..." 标记解决方案）', 'info dim');
    print(`        <span class="err">双方修改： README.md</span>`);
    chiefMutter('status');
    return;
  }

  print(`位于分支 <span class="branch">${state.branch}</span>`);
  const f = state.files['README.md'];

  if (f.stage === 'untracked') {
    print('尚无提交', 'info');
    print('');
    print('未跟踪的文件：', 'info');
    print('  （使用 "git add <文件>..." 以包含要提交的内容）', 'info dim');
    print('        <span class="new">README.md</span>');
  } else if (f.stage === 'staged') {
    print('要提交的变更：', 'info');
    print('  （使用 "git restore --staged <文件>..." 以取消暂存）', 'info dim');
    print('        <span class="staged">新文件：   README.md</span>');
  } else {
    // 已提交 —— 检查当前分支是否提交过
    const hasCommitHere = state.commits.some(c => c.branch === state.branch);
    if (hasCommitHere) {
      print('无文件要提交，干净的工作区', 'ok');
    } else {
      print('无文件要提交，干净的工作区', 'ok');
      print('（提示：本分支还没有提交，可以改动文件后 commit）', 'info');
    }
  }

  // 分支提示
  const other = state.branches.filter(b => b !== state.branch);
  if (other.length) print(`（提示：还有分支 ${other.join(', ')}，可 git checkout 切换）`, 'info dim');

  // 第一次用 status 的村长碎碎念
  if (firstTime) {
    print('');
    print('💡 看到没有？这就是你接下来会敲最多的命令——没有之一。别嫌麻烦，迷路就敲它。', 'info dim');
  }
  chiefMutter('status');
}

function cmdGitAdd(target) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!target) return print('nothing specified, nothing added.', 'info');

  if (target !== 'README.md' && target !== '.') {
    print(`fatal: 路径 '${esc(target)}' 未匹配到任何文件`, 'err');
    print('（提示：这里只有 README.md，试试 git add README.md 或 git add .）', 'info');
    return;
  }

  // 冲突解决：add 后消除冲突（同时把文件标记为已暂存，以便 commit 能接手）
  if (state.merging) {
    state.merging = null;
    state.conflictResolved = true;
    state.files['README.md'].stage = 'staged';
    print('已暂存 README.md —— 冲突标记已解决，可以 commit 完成合并了', 'ok');
    return;
  }

  const f = state.files['README.md'];
  // 只有「本分支已经提交过、且当前没有新改动」时才拒绝重复 add
  if (f.stage === 'staged') {
    print('README.md 已经在暂存区里了，不用再加', 'info');
    return;
  }
  f.stage = 'staged';
  print('已暂存 README.md —— 它进入了「存档准备区」（暂存区）', 'ok');
  if (target === '.') chiefMutter('add');
}

function cmdGitCommit(msg) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!msg) {
    print('error: 提交说明不能为空！', 'err');
    print('（正确写法: git commit -m "提交信息"）', 'info');
    return;
  }

  const f = state.files['README.md'];

  if (f.stage !== 'staged') {
    print('什么也没提交，暂存区是空的', 'err');
    print('（先把文件 add 进暂存区，再 commit —— 就像先打包再存档）', 'info');
    return;
  }

  // 分支场景：该分支已有提交则不再重复
  const branchCommits = state.commits.filter(c => c.branch === state.branch).length;
  if (branchCommits >= 1 && !state.conflictResolved) {
    print('本分支已经有过提交了，本关不需要再提交', 'info');
    return;
  }

  f.stage = 'committed';
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const hash = Math.random().toString(16).slice(2, 9);
  const isFirstCommit = state.commits.length === 0;
  state.commits.push({ msg, time, branch: state.branch, hash });

  if (state.conflictResolved) {
    print(`[${state.branch} ${hash}] ${esc(msg)}`);
    print(' 1 个文件被修改 (+1)', 'info dim');
    print('合并冲突已解决，两个世界线成功汇合！', 'ok');
    print('');
    print('💪 看到没有？冲突也就那么回事。以后再遇到，你就知道：哦，又是这货。', 'info dim');
    state.conflictResolved = false;
    state.merged = true;
    chiefMutter('commit');
    chiefMutter('merge');
    return;
  }

  print(`[${state.branch}（根提交）${hash}] ${esc(msg)}`);
  print(' 1 个文件被修改，3 行被写入 (+3)', 'info dim');
  if (isFirstCommit && state.branch === 'main') {
    print('');
    print('🎉 存档成功！你看，也没那么难嘛。', 'info dim');
  }
  chiefMutter('commit');
}

function cmdGitBranch(name) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');

  if (!name) {
    state.branches.forEach(b => {

    print('');

}

function cmdGitCheckout(name) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!name) return print('error: 请指定要切换的分支名', 'err');

  if (!state.branches.includes(name)) {
    // 模拟自动创建
    if (name === 'feature' || /^[a-zA-Z0-9_\-\/]+$/.test(name)) {
      print(`分支 '${esc(name)}' 不存在，自动创建并切换...`, 'warn');
      state.branches.push(name);
    } else {
      print(`error: 路径规格 '${esc(name)}' 没有匹配到任何文件`, 'err');
      return;
    }
  }
  if (name === state.branch) {
    print(`已经在 '${esc(name)}' 分支上了`, 'info');
    return;
  }
  state.branch = name;
  print(`切换到分支 '${esc(name)}'`, 'ok');
  if (name !== 'main') {
    print('（这个分支还没有任何提交 —— 大胆改动，不影响 main）', 'info');
  }
}

function cmdGitMerge(name) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!name) return print('error: 请指定要合并的分支名', 'err');
  if (!state.branches.includes(name)) return print(`merge: ${esc(name)} - 不是一个有效的分支名`, 'err');
  if (name === state.branch) return print(`已经是最新的。`, 'info');

  const srcHasCommit = state.commits.some(c => c.branch === name);

  if (state.branch === 'main' && name === 'feature') {
    state.mergeAttempted = true;
    if (!srcHasCommit) {
      print(`合并分支 '${esc(name)}' 时出现问题：`, 'warn');
      print('（feature 分支还没有任何提交，先把东西做好再合并）', 'info');
      print('（提示：git checkout feature → git add . → git commit -m "信息"）', 'info');
      return;
    }
    // 制造冲突
    state.merging = { from: name };
    state.conflictSeen = true;
    print(`自动合并 README.md`, 'info');
    print(`<span class="err">冲突（内容）：README.md 中出现合并冲突</span>`);
    print('');
    print('自动合并失败；请修复冲突，然后提交结果。', 'err');
    print('（提示：cat README.md 看看冲突标记长什么样）', 'info');
    print('');
    print('😅 别怕，第一次见冲突都会懵。我当年第一次见直接把文件删了重建...别学我，往下看。', 'info dim');
    chiefMutter('merge');
    return;
  }

  if (state.branch !== 'main') {
    print(`合并分支 '${esc(name)}' 到 <span class="branch">${state.branch}</span>...`, 'info');
    print('（提示：想把改动带回主线，应该先 git checkout main 站到主线上）', 'info');
    return;
  }

  print(`已合并分支 '${esc(name)}'`, 'ok');
  chiefMutter('merge');
}

function cmdGitRemote(args) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!args.length) {
    if (state.remote) return print(`origin\t${state.remote} (fetch)`);
    return print('（没有配置任何远程仓库）', 'info');
  }
  if (args[0] === 'add') {
    const addr = args[2] || args[1];
    if (!addr || !/^(https?:\/\/|git@)/.test(addr)) {
      print('error: 远程地址格式不对', 'err');
      print('（正确格式: git remote add origin https://github.com/用户名/仓库名.git）', 'info');
      return;
    }
    state.remote = addr;
    print(`远程仓库已关联为 <span class="branch">origin</span>: ${esc(addr)}`, 'ok');
    print('（下一步：git push -u origin main）', 'info');
    return;
  }
  if (args[0] === '-v') {
    if (state.remote) return print(`origin\t${state.remote} (fetch)\norigin\t${state.remote} (push)`);
    return print('（没有配置任何远程仓库）', 'info');
  }
  print(`error: 未知的 remote 子命令 '${esc(args[0])}'`, 'err');
}

function cmdGitPush(args) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!state.remote) {
    print('fatal: 没有配置推送目标。', 'err');
    print('（先 git remote add origin 地址）', 'info');
    return;
  }
  if (!state.commits.length) {
    print('error: 还没有任何提交可以推送', 'err');
    print('（先 commit 再 push）', 'info');
    return;
  }
  if (state.merging) {
    print('error: 还有未解决的合并冲突，先解决再推送', 'err');
    return;
  }
  state.pushed = true;
  const wasFirstPush = state.level === 10 || (state.level < 12 && !state.published);
  if (state.level === 12) state.published = true;
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  print('枚举对象中: 5, 完成.', 'info');
  print('对象计数中: 100% (5/5), 完成.', 'info');
  print(`写入对象中: 100% (5/5), 1.23 KiB | 1.23 MiB/s, 完成.`, 'info');
  print(`To ${esc(state.remote)}`, 'info');
  print(`   ${'a'.repeat(7)}..${state.commits[state.commits.length-1].hash}  main -> main`, 'ok');
  print('分支 main 设置为跟踪来自 origin 的远程分支 main。', 'info');
  print('');
  print('🎊 代码已经上云！现在就算电脑坏了，你的项目也不会丢。', 'ok');
  if (wasFirstPush && state.level !== 12) {
    print('');
    print('☁️  上云了！从此你电脑炸了代码都不会丢。（你电脑可别真炸啊）', 'info dim');
  }
  chiefMutter('push');
}

// ---------- git restore（第 11 关：后悔药）----------
function cmdGitRestore(args) {
  if (!state.repo) return print("fatal: not a git repository (or any of the parent directories): .git", 'err');
  if (!args.length) {
    print('error: 请指定要恢复的文件或加 --staged', 'err');
    print('（正确写法: git restore --staged README.md）', 'info');
    return;
  }

  const staged = args.includes('--staged');
  const file = args.find(a => !a.startsWith('--'));

  if (staged) {
    // 撤销暂存 —— 安全操作
    const f = state.files['README.md'];
    if (f.stage !== 'staged') {
      print('暂存区里现在没有 README.md，没什么可撤销的。', 'info');
      print('（先 git add README.md 把它放进暂存区，再来练撤销）', 'info');
      return;
    }
    f.stage = 'untracked';
    state.restoreUsed = true;
    print('已从暂存区移除 README.md —— 改动还在，只是不再准备提交', 'ok');
    print('（这个操作完全安全，随便用）', 'info');
    return;
  }

  // 不带 --staged —— 危险操作，做警示但不真执行
  print('⚠️  危险操作提醒', 'warn');
  print(`git restore ${esc(file || '文件')} 会直接丢弃你对文件的修改，且无法恢复！`, 'err');
  print('（本模拟器为了保护你的练习进度，不会真的执行这个操作）', 'info');
  print('（要撤销暂存，请用: git restore --staged README.md）', 'info');
}

// ---------- 进度保存（localStorage）----------
const STORAGE_KEY = 'git-dojo-progress';

// 需要保存的关键字段（不保存临时的 UI 状态）
const SAVE_FIELDS = [
  'repo', 'branch', 'branches', 'files', 'commits', 'remote', 'pushed',
  'level', 'unlockedSkills', 'merging', 'mergeAttempted', 'merged',
  'conflictSeen', 'conflictResolved', 'statusUsed', 'logUsed',
  'restoreUsed', 'published', 'lectureDone',
];

function saveProgress() {
  try {
    const data = {};
    SAVE_FIELDS.forEach(k => { data[k] = state[k]; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // localStorage 可能不可用（隐私模式等），静默失败
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;
    // 把保存的字段合并回 state
    SAVE_FIELDS.forEach(k => {
      if (data[k] !== undefined) state[k] = data[k];
    });
    return true;
  } catch (e) {
    return false;
  }
}

function resetProgress() {
  if (!confirm('确定要重置所有进度吗？已解锁的技能和通关记录都会清零。')) return;
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (e) {}
  // 刷新页面从头开始
  location.reload();
}

// ---------- 跳关 / 关卡选择 ----------
let levelSelectorOpen = false;

function showLevelSelector() {
  levelSelectorOpen = true;
  modalOpen = true;
  const levels = [];
  for (let i = 0; i <= state.MAX_LEVEL; i++) {
    const L = LEVELS[i];
    if (!L) continue;
    const isCurrent = i === state.level;
    levels.push(`
      <div class="level-item ${isCurrent ? 'current' : ''}" onclick="${isCurrent ? '' : `jumpToLevel(${i})`}">
        <span class="lv-num">第 ${i} 关</span>
        <span class="lv-title">${esc(L.title.replace(/^关卡\s*\d+\s*·\s*/, '').replace(/^第\s*\d+\s*关\s*·\s*/, ''))}</span>
      </div>
    `);
  }

  modalRoot.innerHTML = `
    <div class="modal-mask" id="mask" onclick="if(event.target.id==='mask')hideLevelSelector()">
      <button class="modal-close" onclick="hideLevelSelector()" aria-label="关闭">✕</button>
      <div class="modal">
        <div class="badge">🗺️ 选择关卡</div>
        <h2>跳转到任意一关</h2>
        <div class="sub">老手想复习？直接跳过去就行。跳过后该关的知识点会自动解锁。</div>
        <div class="level-selector-grid">
          ${levels.join('')}
        </div>
        <div class="modal-footer">
          <span class="note">当前在第 ${state.level} 关</span>
          <button class="btn-ghost" onclick="hideLevelSelector()">取消</button>
        </div>
      </div>
    </div>`;
}

function hideLevelSelector() {
  if (!levelSelectorOpen) return;
  modalRoot.innerHTML = '';
  levelSelectorOpen = false;
  modalOpen = false;
  input.focus();
}

function jumpToLevel(targetLevel) {
  if (targetLevel < 0 || targetLevel > state.MAX_LEVEL) return;

  // 标记中间所有关卡的技能为已解锁
  for (let i = 0; i <= targetLevel; i++) {
    const L = LEVELS[i];
    if (L && L.skill && !state.unlockedSkills.includes(L.skill)) {
      state.unlockedSkills.push(L.skill);
    }
  }

  // 第 0 关跳过时标记为已读
  if (targetLevel >= 1) {
    state.lectureDone = true;
  }

  // 设置到目标关卡
  state.level = targetLevel;

  hideLevelSelector();
  modalOpen = false;

  // 如果跳到更高关卡，需要恢复必要的游戏状态
  // 简单做法：把 repo 设为 true，补上必要的提交和分支
  if (targetLevel >= 1) state.repo = true;
  if (targetLevel >= 2) state.statusUsed = true;
  if (targetLevel >= 3) {
    state.files['README.md'].stage = 'committed';
    if (state.commits.length < 1) {
      state.commits.push({ msg: '初始提交', time: new Date().toLocaleTimeString('zh-CN', { hour12: false }), branch: 'main', hash: 'a1b2c3d' });
    }
  }
  if (targetLevel >= 4) state.logUsed = true;
  if (targetLevel >= 5) {
    if (!state.branches.includes('feature')) state.branches.push('feature');
  }
  if (targetLevel >= 6) state.branch = 'feature';
  if (targetLevel >= 7) {
    if (!state.commits.some(c => c.branch === 'feature')) {
      state.commits.push({ msg: '在 feature 上的提交', time: new Date().toLocaleTimeString('zh-CN', { hour12: false }), branch: 'feature', hash: 'e5f6g7h' });
    }
  }
  if (targetLevel >= 8) state.mergeAttempted = true;
  if (targetLevel >= 9) state.merged = true;
  if (targetLevel >= 10) { state.pushed = true; state.remote = 'https://github.com/冒险者/git-dojo.git'; }
  if (targetLevel >= 11) state.restoreUsed = true;
  if (targetLevel >= 12) { state.published = true; state.pushed = false; state.remote = null; }

  refreshAfterLevel();
  saveProgress();

  print('', '');
  print(`⚡ 已跳转到第 ${targetLevel} 关 —— ${esc(LEVELS[targetLevel]?.title || '')}`, 'warn');
  print('（该关及之前的知识点已自动解锁，可在左侧技能书查看）', 'info');
}

// ---------- 错误时的村长碎碎念 ----------
function errorMutter() {
  errorCount++;
  if (errorCount >= 3) {
    // 连续 3 次以上错误，概率给提示
    if (Math.random() < 0.5) {
      print('（连续错好几次了，要不要输个 hint 看看提示？）', 'dim');
    }
  } else if (errorCount === 1) {
    // 第一次错误，30% 概率安慰
    if (Math.random() < 0.3) {
      print('（没事，谁还没输错过呢。我刚学的时候连 init 都能拼错。）', 'dim');
    }
  }
}

// ---------- 主分发 ----------
function processCommand(raw) {
  const tokens = tokenize(raw);
  if (!tokens.length) return;
  echoCommand(raw);

  const [cmd, sub, ...rest] = tokens;

  if (cmd === 'help') { errorCount = 0; return cmdHelp(); }
  if (cmd === 'clear') { errorCount = 0; screen.innerHTML = ''; return; }

  // 彩蛋命令（先尝试匹配，匹配到了就不走正常逻辑）
  if (cmd !== 'git' && tryEasterEgg(cmd, tokens)) { errorCount = 0; return; }

  if (cmd === 'ls') { errorCount = 0; return cmdLs(); }
  if (cmd === 'cat') { errorCount = 0; return cmdCat(sub); }

  if (cmd !== 'git') {
    print(`bash: ${esc(cmd)}: 未找到命令 —— 本模拟器支持 ls / cat / git / help / clear`, 'err');
    errorMutter();
    return;
  }

  // 第 0 关未读完时，拦截 git 命令
  if (guardLecture()) return;

  errorCount = 0; // git 命令被识别，重置错误计数
  switch (sub) {
    case 'init':    return cmdGitInit();
    case 'status':  return cmdGitStatus();
    case 'log':     return cmdGitLog();
    case 'add':     return cmdGitAdd(rest[0]);
    case 'commit':
      if (rest[0] === '-m') return cmdGitCommit(rest[1]);
      return cmdGitCommit(null);
    case 'branch':  return cmdGitBranch(rest[0]);
    case 'checkout':
    case 'switch':  return cmdGitCheckout(rest[0]);
    case 'merge':   return cmdGitMerge(rest[0]);
    case 'remote':  return cmdGitRemote([rest[0], rest[1], rest[2]].filter(Boolean));
    case 'push':    return cmdGitPush(rest);
    case 'restore': return cmdGitRestore(rest);
    case 'config':  return cmdGitConfig(rest);
    case '--version':
      print('git version 2.43.0 (新手村特供版)');
      return;
    case 'gud':
      print('哈哈，你是玩游戏过来的吧？git gud = get good，加油练～', 'info');
      return;
    default:
      print(`git: '${esc(sub ?? '')}' 不是一个 git 命令。参见 'git --help'。`, 'err');
      print('（提示：先输 help 看看本模拟器支持哪些命令）', 'info');
  }
}

// ---------- 知识点弹窗 ----------
let modalOpen = false;

function renderBlocks(blocks) {
  return blocks.map(bl => {
    const iconHtml = bl.icon ? `<span class="ico">${bl.icon}</span>` : '';
    const head = `<div class="k-head">${iconHtml}${bl.head}</div>`;
    if (bl.type === 'text') {
      return `<div class="know-block">${head}<p>${bl.text}</p></div>`;
    }
    if (bl.type === 'analogy') {
      return `<div class="know-block">${head}<div class="analogy">${bl.text}</div></div>`;
    }
    if (bl.type === 'real') {
      return `<div class="know-block">${head}<div class="real">${bl.text}</div></div>`;
    }
    if (bl.type === 'list') {
      return `<div class="know-block">${head}<ul>${bl.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
    }
    if (bl.type === 'code') {
      return `<div class="know-block">${head}<div class="analogy" style="border-left-color:#60a5fa;font-family:'JetBrains Mono',Consolas,monospace;font-size:12.5px;white-space:pre-wrap">${esc(bl.text)}</div></div>`;
    }
    return '';
  }).join('');
}

function showKnowledge(levelKey, opts = {}) {
  const L = LEVELS[levelKey];
  if (!L || !L.knowledge) return;
  const k = L.knowledge;

  modalOpen = true;
  modalRoot.innerHTML = `
    <div class="modal-mask" id="mask" onclick="if(event.target.id==='mask')closeModal(false)">
      <button class="modal-close" onclick="closeModal(false)" aria-label="关闭">✕</button>
      <div class="modal">
        <div class="badge">📖 知识点解锁 · ${esc(L.title)}</div>
        <h2>${esc(k.title)}</h2>
        <div class="sub">${esc(k.sub)}</div>
        ${renderBlocks(k.blocks)}
        <div class="modal-footer">
          <span class="note">${opts.isReview ? '复习模式' : '读完了就能继续闯关'}</span>
          <button class="btn-primary" onclick="closeModal(${opts.advance ? 'true' : 'false'})">${opts.isReview ? '看完了，关闭' : (opts.advance ? '我懂了，开始第一关 →' : '我懂了，继续')}</button>
        </div>
      </div>
    </div>`;

  if (!opts.isReview && L.skill && !state.unlockedSkills.includes(L.skill)) {
    state.unlockedSkills.push(L.skill);
    renderSkillBook();
  }
}

function closeModal(advance) {
  modalRoot.innerHTML = '';
  modalOpen = false;
  input.focus();
  // 第 0 关：读完讲解后自动进入正式关卡
  if (advance) {
    state.lectureDone = true;
    state.level = 1;
    print('');
    print('📘 入门课读完，正式开始闯关！', 'ok');
    print('第 1 关的任务已经出现在左边 👈', 'info');
    refreshAfterLevel();
    saveProgress();
  }
}

function showKnowledgeForCurrent() {
  const L = LEVELS[state.level];
  if (state.level === 0 && !state.lectureDone) {
    showKnowledge(0, { advance: true });
    return;
  }
  if (!L) {
    // 已通关全部 → 显示最后一关的知识点
    showKnowledge(state.MAX_LEVEL, { isReview: true });
    return;
  }
  showKnowledge(state.level, { isReview: true });
}

// ---------- 技能书 ----------
function renderSkillBook() {
  const el = document.getElementById('skillList');
  if (!state.unlockedSkills.length) {
    el.innerHTML = '<div class="skill-empty">还没有解锁任何技能，先去通关吧 →</div><button class="reset-btn" onclick="resetProgress()">🔄 重置进度</button>';
    return;
  }
  const skillsHtml = state.unlockedSkills.map(key => {
    const L = Object.entries(LEVELS).find(([, v]) => v.skill === key);
    if (!L) return '';
    const [idx, lvl] = L;
    return `<div class="skill-item" onclick="skillBookMutter();showKnowledge(${idx}, {isReview:true})">
      <span class="tag">${esc(lvl.skill)}</span>${esc(lvl.knowledge.title)}
    </div>`;
  }).join('');
  el.innerHTML = skillsHtml + '<button class="reset-btn" onclick="resetProgress()">🔄 重置进度</button>';
}

    html += `
    <div class="quest-nav">
      <span class="label">当前进度</span>
      <span>
        <span class="now">第 ${cur} / ${state.MAX_LEVEL} 关</span>

  } else {
    html += `
    <div class="quest-nav">
      <span class="label">全部通关</span>
      <span>
        <span class="now">🎓 已毕业</span>
        <button class="jump-btn" onclick="showLevelSelector()">🗺️ 选关复习</button>

      <div class="goal">下一步：去真实项目里练手 —— 找个小项目 git clone 下来，试着改点东西提 PR。</div>

}

function renderStars() {
  // 第 0 关是纯讲解关，不计入星星进度
  const passed = Math.max(0, state.level - 1);
  const n = Math.min(passed, state.MAX_LEVEL);
  const percent = (n / state.MAX_LEVEL) * 100;
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('stars').textContent =
    '⭐'.repeat(n) + '☆'.repeat(state.MAX_LEVEL - n);
  document.getElementById('progressText').textContent = `进度 ${n} / ${state.MAX_LEVEL}`;
}

// ---------- 通关判定 ----------
let knowledgePending = false;

function checkLevel() {
  if (modalOpen || knowledgePending) return;
  const L = LEVELS[state.level];
  if (!L) return;

  // 纯讲解关（第 0 关）不通过命令推进，只能靠读完卡片推进
  if (L.isLecture) return;

  if (L.check()) {
    print('');
    print('🎉🎉🎉  恭喜通关「' + esc(L.title) + '」！ 🎉🎉🎉', 'ok');

    // 撒花庆祝
    spawnConfetti();
    spawnRibbon();
    setTimeout(spawnRandomFirework, 100);

    // 先弹知识点（通关但还没学）
    if (L.knowledge && !state.unlockedSkills.includes(L.skill)) {
      knowledgePending = true;
      setTimeout(() => {
        showKnowledge(state.level);
        knowledgePending = false;
        state.level++;
        refreshAfterLevel();
        saveProgress();
      }, 600);
      return;
    }

    state.level++;
    refreshAfterLevel();
  }
}

function refreshAfterLevel() {
  renderQuests();
  renderStars();
  renderSkillBook();

  // 进入第 12 关时重置推送状态，让玩家必须亲手重走一遍完整流程
  if (state.level === 12) {
    state.pushed = false;
    state.remote = null;
    print('', '');
    print('🎯 最后一关：把完整流程亲手走一遍 —— 这次是从零开始的真实演练。', 'warn');
    print('（远程仓库已重置，请重新 git remote add origin ...）', 'info');
  }

  if (state.level > state.MAX_LEVEL) {

    print('🏆🏆🏆  恭喜！你已经通关全部 12 关，Git 新手村毕业！  🏆🏆🏆', 'ok');
    print('', '');
    print('📖 回头看看左下角的「已解锁技能」，13 张知识点卡片随时点开复习。', 'info');
    print('', '');
    print('💬 说实话，能一路打到这里的人不多。你比你自己想的要厉害。出去之后别丢新手村的脸啊！', 'info dim');

    print('<span class="warn">下一步（真的去做，别只是看看）：</span>', 'info');

    print('  2. 打开 Git Bash，把本游戏目录 cd 进去', 'info');
    print('  3. 照着第 12 关的命令，把 git-dojo 真的推上你的 GitHub', 'info');
    print('  4. 然后就可以在简历上写「开源项目作者」了 🎉', 'info');
    // 全通关大庆祝

    print('✨ 新关卡已解锁，看左边任务面板 →', 'info');

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (modalOpen) return;
    if (levelSelectorOpen) return;
    const v = input.value;
    input.value = '';
    historyCmds.push(v);
    historyIdx = historyCmds.length;
    processCommand(v);
    checkLevel();
    saveProgress();
  } else if (e.key === 'ArrowUp' && historyIdx > 0) {
    historyIdx--;
    input.value = historyCmds[historyIdx];
    e.preventDefault();
  } else if (e.key === 'ArrowDown') {
    if (historyIdx < historyCmds.length - 1) {
      historyIdx++;
      input.value = historyCmds[historyIdx];
    } else { historyIdx = historyCmds.length; input.value = ''; }
    e.preventDefault();
  }
});

document.querySelector('.terminal-wrap').addEventListener('click', () => {
  if (!modalOpen) input.focus();
});

// 按 Esc 关闭弹窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (levelSelectorOpen) { hideLevelSelector(); return; }
    if (modalOpen) closeModal();
  }
});

// ---------- 星空背景 ----------
(function initStarfield() {
  const canvas = document.getElementById('starfield');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let stars = [];
  const STAR_COUNT = 80;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function createStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 0.5 + Math.random() * 2,
        speed: 0.1 + Math.random() * 0.3,
        opacity: 0.3 + Math.random() * 0.7,
        twinkleSpeed: 0.01 + Math.random() * 0.03,
        twinklePhase: Math.random() * Math.PI * 2,
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.twinklePhase += s.twinkleSpeed;
      const alpha = s.opacity * (0.5 + 0.5 * Math.sin(s.twinklePhase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
      // 缓慢向下漂移
      s.y += s.speed;
      if (s.y > canvas.height + 5) {
        s.y = -5;
        s.x = Math.random() * canvas.width;
      }
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', () => {
    resize();
    createStars();
  });

  resize();
  createStars();
  animate();
})();

// ---------- 增强庆祝效果：彩带 + 烟花 ----------
function spawnRibbon() {
  const colors = ['#f472b6', '#4ade80', '#60a5fa', '#fbbf24', '#a78bfa', '#22d3ee', '#f87171'];
  const count = 30;
  for (let i = 0; i < count; i++) {
    const r = document.createElement('div');
    r.className = 'ribbon';
    r.style.left = Math.random() * 100 + 'vw';
    r.style.background = colors[Math.floor(Math.random() * colors.length)];
    r.style.animationDuration = (3 + Math.random() * 3) + 's';
    r.style.animationDelay = Math.random() * 0.8 + 's';
    r.style.width = (6 + Math.random() * 8) + 'px';
    r.style.height = (30 + Math.random() * 30) + 'px';
    r.style.opacity = 0.8 + Math.random() * 0.2;
    celebrateContainer.appendChild(r);
    setTimeout(() => r.remove(), 6500);
  }
}

function spawnFirework(x, y) {
  const colors = ['#f472b6', '#4ade80', '#60a5fa', '#fbbf24', '#a78bfa', '#22d3ee'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const count = 16;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'firework';
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
    const angle = (i / count) * Math.PI * 2;
    const dist = 50 + Math.random() * 80;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    celebrateContainer.appendChild(p);
    setTimeout(() => p.remove(), 1100);
  }
}

// 随机位置的烟花
function spawnRandomFirework() {
  const x = window.innerWidth * (0.2 + Math.random() * 0.6);
  const y = window.innerHeight * (0.2 + Math.random() * 0.4);
  spawnFirework(x, y);
}

// 大庆祝：彩带 + 撒花 + 烟花，三波
function bigCelebration() {
  // 第一波
  spawnConfetti();
  spawnRibbon();
  spawnRandomFirework();

  // 第二波

    spawnConfetti();
    spawnRibbon();
    spawnRandomFirework();
    setTimeout(spawnRandomFirework, 200);
    setTimeout(spawnRandomFirework, 500);
  }, 600);

  // 第三波
  setTimeout(() => {
    spawnConfetti();
    spawnRibbon();
    spawnRandomFirework();
    setTimeout(spawnRandomFirework, 300);
    setTimeout(spawnRandomFirework, 600);
    setTimeout(spawnRandomFirework, 900);
  }, 1400);
}
